app = "public-bank-goa"
primary_region = "bom"

[build]
  builder = "paketobuildpacks/builder-jammy-base"

[env]
  PB_DB = "/data/publicbank.sqlite"

[mounts]
  source = "pbdata"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1
