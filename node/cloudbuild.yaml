# Deploy on merge. Two Cloud Build triggers point here (set up once with the commands in README.md, "Deploy"):
#   main    → service publicbank          (production: goa.cyberneticsociety.com)
#   staging → service publicbank-staging  (its own database, the development sign-in flag on)
# Each build makes the image from node/Dockerfile, pushes it to Artifact Registry, deploys it to Cloud Run with the
# same flags deploy.sh used, and points the seed job at the new image so one-off commands run the deployed code.
# Secrets never appear here: the service reads them from Secret Manager by name.
substitutions:
  _SERVICE: publicbank
  _REGION: asia-southeast1
  _BASE_URL: https://goa.cyberneticsociety.com
  _OLD_HOSTS: goa.cyberneticsutra.com,bank.cyberneticsutra.com
  _DB_SECRET: DATABASE_URL
  _EXTRA_ENV: ""            # staging: PB_OTP_DEV=1 (the sign-in code is shown on screen; never on production)
  _MIN_INSTANCES: "1"
  _REPO: publicbank         # the Artifact Registry repository, created once: gcloud artifacts repositories create publicbank --repository-format=docker --location=asia-southeast1
options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    dir: node
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest", "."]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"]
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        CONN=$(gcloud sql instances describe publicbank --format='value(connectionName)')
        EXTRA=""
        if gcloud secrets describe ANTHROPIC_API_KEY >/dev/null 2>&1; then EXTRA=",ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest"; fi
        for s in PB_WA_TOKEN PB_WA_APP_SECRET; do if gcloud secrets describe $s >/dev/null 2>&1; then EXTRA="$EXTRA,$s=$s:latest"; fi; done
        ENV="PB_BASE_URL=${_BASE_URL},PB_OLD_HOSTS=${_OLD_HOSTS},PB_BOT_USERNAME=cybernetic_society_bot,EDGEOS_API_BASE=https://api.edgeos.world"
        if [ -n "${_EXTRA_ENV}" ]; then ENV="$ENV,${_EXTRA_ENV}"; fi
        gcloud run deploy ${_SERVICE} --image "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA" --region=${_REGION} \
          --allow-unauthenticated --add-cloudsql-instances="$CONN" --min-instances=${_MIN_INSTANCES} --max-instances=3 --memory=512Mi \
          --set-env-vars="$ENV" \
          --set-secrets="DATABASE_URL=${_DB_SECRET}:latest,PB_SECRET=PB_SECRET:latest,PB_APP_TOKEN=PB_APP_TOKEN:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest$EXTRA" --quiet
        # the one-off job runs the code just deployed, so "No module named …" never follows a deploy again
        if [ "${_SERVICE}" = "publicbank" ]; then
          gcloud run jobs update publicbank-seed --region=${_REGION} --image "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA" --quiet || true
        fi
        gcloud run services describe ${_SERVICE} --region=${_REGION} --format='value(status.url)'
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA"
timeout: 1200s
